admin.reports_list=SELECT id, property_id, reason, details, status, created_at FROM reports ORDER BY created_at DESC LIMIT 300
admin.users_list=SELECT id, email, phone, full_name, is_active, created_at FROM users ORDER BY created_at DESC LIMIT 500
