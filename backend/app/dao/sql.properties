admin.approval_insert=INSERT INTO listing_approvals (property_id, admin_id, decision, reason, created_at) VALUES (:property_id, :admin_id, :decision, :reason, :created_at)
admin.settings_list=SELECT key, value, updated_at FROM platform_settings ORDER BY key
admin.setting_by_key=SELECT key FROM platform_settings WHERE key = :key
admin.setting_insert=INSERT INTO platform_settings (key, value, updated_at) VALUES (:key, :value, :updated_at)
admin.setting_update=UPDATE platform_settings SET value = :value, updated_at = :updated_at WHERE key = :key
admin.contact_messages=SELECT id, name, email, topic, message, status, created_at FROM contact_messages ORDER BY created_at DESC LIMIT 500
contact_messages.insert=INSERT INTO contact_messages (id, name, email, topic, message, consent_at, status, created_at) VALUES (:id, :name, :email, :topic, :message, :consent_at, 'new', :created_at)
contact_messages.count=SELECT COUNT(*) FROM contact_messages
newsletter.by_email=SELECT id FROM newsletter_subscriptions WHERE email = :email
newsletter.insert=INSERT INTO newsletter_subscriptions (email, consent_at, is_active) VALUES (:email, :consent_at, TRUE)
newsletter.activate=UPDATE newsletter_subscriptions SET is_active = TRUE, consent_at = :consent_at WHERE email = :email

