# Users and authentication
users.by_email=SELECT id, firebase_uid, email, phone, full_name, avatar_url, is_active, is_verified, created_at FROM users WHERE email = :email
users.by_firebase_uid=SELECT id, firebase_uid, email, phone, full_name, avatar_url, is_active, is_verified, created_at FROM users WHERE firebase_uid = :firebase_uid
users.by_id=SELECT id, firebase_uid, email, phone, full_name, avatar_url, is_active, is_verified, created_at FROM users WHERE id = :id
users.insert=INSERT INTO users (id, firebase_uid, email, phone, full_name, avatar_url, is_active, is_verified, created_at) VALUES (:id, :firebase_uid, :email, :phone, :full_name, :avatar_url, :is_active, :is_verified, :created_at)
users.update_profile=UPDATE users SET full_name = :full_name, avatar_url = :avatar_url WHERE id = :id
users.list_admin=SELECT id, email, phone, full_name, is_active, created_at FROM users ORDER BY created_at DESC LIMIT 500
users.roles=SELECT role FROM user_roles WHERE user_id = :user_id ORDER BY role
users.roles_for_all=SELECT user_id, role FROM user_roles
user_roles.insert=INSERT INTO user_roles (user_id, role) VALUES (:user_id, :role)
user_roles.delete_all=DELETE FROM user_roles WHERE user_id = :user_id
user_roles.delete_admin=DELETE FROM user_roles WHERE user_id = :user_id AND role = 'admin'
profiles.by_user=SELECT bio, company, contact_phone, experience_years, address FROM user_profiles WHERE user_id = :user_id
profiles.insert=INSERT INTO user_profiles (user_id, bio, company, contact_phone, experience_years, address, preferences, updated_at) VALUES (:user_id, :bio, :company, :contact_phone, :experience_years, :address, :preferences, :updated_at)
profiles.update=UPDATE user_profiles SET bio = :bio, company = :company, contact_phone = :contact_phone, experience_years = :experience_years, address = :address, updated_at = :updated_at WHERE user_id = :user_id

# Properties and listing relationships
properties.search_count=SELECT COUNT(DISTINCT p.id) FROM properties p WHERE p.status = 'published' AND (:city IS NULL OR lower(p.city) = lower(:city)) AND (:locality IS NULL OR lower(p.locality) = lower(:locality)) AND (:transaction_type IS NULL OR p.transaction_type = :transaction_type) AND (:property_type IS NULL OR p.property_type = :property_type) AND (:furnishing IS NULL OR p.furnishing = :furnishing) AND (:possession_status IS NULL OR p.possession_status = :possession_status) AND (:pincode IS NULL OR p.pincode = :pincode) AND (:min_price IS NULL OR p.price >= :min_price) AND (:max_price IS NULL OR p.price <= :max_price) AND (:bedrooms IS NULL OR p.bedrooms >= :bedrooms) AND (:bathrooms IS NULL OR p.bathrooms >= :bathrooms) AND (:verified IS NULL OR p.rera_verified = :verified) AND (:featured IS NULL OR p.featured = :featured) AND (:parking = 0 OR p.parking > 0) AND (:min_area IS NULL OR p.carpet_area >= :min_area OR p.builtup_area >= :min_area) AND (:max_area IS NULL OR p.carpet_area <= :max_area OR p.builtup_area <= :max_area) AND (:posted_after IS NULL OR p.created_at >= :posted_after) AND (:search_term IS NULL OR lower(p.title) LIKE :search_term OR lower(p.locality) LIKE :search_term OR lower(p.city) LIKE :search_term OR p.pincode LIKE :search_term) AND (:amenity IS NULL OR EXISTS (SELECT 1 FROM property_amenities pa JOIN amenities a ON a.id = pa.amenity_id WHERE pa.property_id = p.id AND lower(a.name) LIKE :amenity))
properties.search=SELECT DISTINCT p.* FROM properties p WHERE p.status = 'published' AND (:city IS NULL OR lower(p.city) = lower(:city)) AND (:locality IS NULL OR lower(p.locality) = lower(:locality)) AND (:transaction_type IS NULL OR p.transaction_type = :transaction_type) AND (:property_type IS NULL OR p.property_type = :property_type) AND (:furnishing IS NULL OR p.furnishing = :furnishing) AND (:possession_status IS NULL OR p.possession_status = :possession_status) AND (:pincode IS NULL OR p.pincode = :pincode) AND (:min_price IS NULL OR p.price >= :min_price) AND (:max_price IS NULL OR p.price <= :max_price) AND (:bedrooms IS NULL OR p.bedrooms >= :bedrooms) AND (:bathrooms IS NULL OR p.bathrooms >= :bathrooms) AND (:verified IS NULL OR p.rera_verified = :verified) AND (:featured IS NULL OR p.featured = :featured) AND (:parking = 0 OR p.parking > 0) AND (:min_area IS NULL OR p.carpet_area >= :min_area OR p.builtup_area >= :min_area) AND (:max_area IS NULL OR p.carpet_area <= :max_area OR p.builtup_area <= :max_area) AND (:posted_after IS NULL OR p.created_at >= :posted_after) AND (:search_term IS NULL OR lower(p.title) LIKE :search_term OR lower(p.locality) LIKE :search_term OR lower(p.city) LIKE :search_term OR p.pincode LIKE :search_term) AND (:amenity IS NULL OR EXISTS (SELECT 1 FROM property_amenities pa JOIN amenities a ON a.id = pa.amenity_id WHERE pa.property_id = p.id AND lower(a.name) LIKE :amenity)) ORDER BY CASE WHEN :sort = 'price_asc' THEN p.price END ASC, CASE WHEN :sort = 'price_desc' THEN p.price END DESC, CASE WHEN :sort = 'oldest' THEN p.created_at END ASC, CASE WHEN :sort = 'relevance' THEN p.featured END DESC, CASE WHEN :sort IN ('newest', 'relevance') THEN p.created_at END DESC LIMIT :limit OFFSET :offset
properties.by_id=SELECT * FROM properties WHERE id = :id
properties.by_alias=SELECT * FROM properties WHERE slug = :slug OR property_id = :property_id LIMIT 1
properties.by_owner=SELECT * FROM properties WHERE owner_id = :owner_id AND status <> 'deleted' ORDER BY created_at DESC
properties.admin_list=SELECT * FROM properties WHERE (:status IS NULL OR status = :status) ORDER BY created_at DESC LIMIT 300
properties.insert=INSERT INTO properties (id, owner_id, property_id, slug, title, description, transaction_type, property_type, status, city, state, locality, address, pincode, latitude, longitude, price, maintenance, deposit, negotiable, bedrooms, bathrooms, balconies, carpet_area, builtup_area, furnishing, floor_number, total_floors, facing, parking, age_years, possession_status, rera_number, rera_verified, featured, demo, created_at, updated_at) VALUES (:id, :owner_id, :property_id, :slug, :title, :description, :transaction_type, :property_type, :status, :city, :state, :locality, :address, :pincode, :latitude, :longitude, :price, :maintenance, :deposit, :negotiable, :bedrooms, :bathrooms, :balconies, :carpet_area, :builtup_area, :furnishing, :floor_number, :total_floors, :facing, :parking, :age_years, :possession_status, :rera_number, :rera_verified, :featured, :demo, :created_at, :updated_at)
properties.update=UPDATE properties SET title = :title, description = :description, transaction_type = :transaction_type, property_type = :property_type, city = :city, state = :state, locality = :locality, address = :address, pincode = :pincode, latitude = :latitude, longitude = :longitude, price = :price, maintenance = :maintenance, deposit = :deposit, negotiable = :negotiable, bedrooms = :bedrooms, bathrooms = :bathrooms, balconies = :balconies, carpet_area = :carpet_area, builtup_area = :builtup_area, furnishing = :furnishing, floor_number = :floor_number, total_floors = :total_floors, facing = :facing, parking = :parking, age_years = :age_years, possession_status = :possession_status, rera_number = :rera_number, status = 'pending', updated_at = :updated_at WHERE id = :id
properties.status_update=UPDATE properties SET status = :status, moderation_note = :moderation_note, updated_at = :updated_at WHERE id = :id
properties.feature_update=UPDATE properties SET featured = :featured, updated_at = :updated_at WHERE id = :id
properties.images=SELECT url FROM property_images WHERE property_id = :property_id ORDER BY position
properties.images_delete=DELETE FROM property_images WHERE property_id = :property_id
properties.image_insert=INSERT INTO property_images (id, property_id, url, alt_text, position, is_cover) VALUES (:id, :property_id, :url, :alt_text, :position, :is_cover)
properties.amenities=SELECT a.name FROM amenities a JOIN property_amenities pa ON pa.amenity_id = a.id WHERE pa.property_id = :property_id ORDER BY a.name
properties.amenities_delete=DELETE FROM property_amenities WHERE property_id = :property_id
amenities.by_name=SELECT id FROM amenities WHERE name = :name
amenities.insert=INSERT INTO amenities (name) VALUES (:name)
property_amenities.insert=INSERT INTO property_amenities (property_id, amenity_id) VALUES (:property_id, :amenity_id)
favourites.by_user_property=SELECT id FROM favourites WHERE user_id = :user_id AND property_id = :property_id
favourites.insert=INSERT INTO favourites (user_id, property_id, created_at) VALUES (:user_id, :property_id, :created_at)
favourites.delete=DELETE FROM favourites WHERE user_id = :user_id AND property_id = :property_id
favourites.properties=SELECT p.* FROM properties p JOIN favourites f ON f.property_id = p.id WHERE f.user_id = :user_id ORDER BY f.created_at DESC

# Enquiries, visits, reports, notifications, and saved searches
inquiries.insert=INSERT INTO inquiries (id, property_id, sender_id, recipient_id, name, email, phone, message, consent_at, status, created_at) VALUES (:id, :property_id, :sender_id, :recipient_id, :name, :email, :phone, :message, :consent_at, 'new', :created_at)
inquiries.by_user=SELECT i.*, p.title AS property_title FROM inquiries i JOIN properties p ON p.id = i.property_id WHERE i.sender_id = :user_id OR i.recipient_id = :user_id ORDER BY i.created_at DESC
inquiries.by_id=SELECT * FROM inquiries WHERE id = :id
inquiries.update_status=UPDATE inquiries SET status = :status WHERE id = :id
visits.insert=INSERT INTO property_visits (id, property_id, user_id, name, phone, scheduled_at, consent_at, status, created_at) VALUES (:id, :property_id, :user_id, :name, :phone, :scheduled_at, :consent_at, 'requested', :created_at)
visits.by_user=SELECT v.*, p.title AS property_title, p.owner_id FROM property_visits v JOIN properties p ON p.id = v.property_id WHERE v.user_id = :user_id OR p.owner_id = :user_id ORDER BY v.scheduled_at
visits.by_id=SELECT * FROM property_visits WHERE id = :id
visits.update_status=UPDATE property_visits SET status = :status WHERE id = :id
notifications.insert=INSERT INTO notifications (id, user_id, title, body, read_at, created_at) VALUES (:id, :user_id, :title, :body, NULL, :created_at)
notifications.by_user=SELECT id, title, body, read_at, created_at FROM notifications WHERE user_id = :user_id ORDER BY created_at DESC LIMIT 100
notifications.mark_read=UPDATE notifications SET read_at = :read_at WHERE id = :id AND user_id = :user_id
saved_searches.insert=INSERT INTO saved_searches (id, user_id, name, filters, created_at) VALUES (:id, :user_id, :name, :filters, :created_at)
saved_searches.by_user=SELECT id, name, filters FROM saved_searches WHERE user_id = :user_id ORDER BY created_at DESC
reports.insert=INSERT INTO reports (id, property_id, reporter_id, reason, details, status, created_at) VALUES (:id, :property_id, :reporter_id, :reason, :details, 'open', :created_at)
reports.admin_list=SELECT id, property_id, reason, details, status, created_at FROM reports ORDER BY created_at DESC LIMIT 300
reports.open_count=SELECT COUNT(*) FROM reports WHERE status = 'open'
reports.by_id=SELECT id, status FROM reports WHERE id = :id
reports.update_status=UPDATE reports SET status = :status WHERE id = :id
inquiries.count=SELECT COUNT(*) FROM inquiries
properties.owner_email=SELECT u.email FROM users u JOIN properties p ON p.owner_id = u.id WHERE p.id = :property_id
properties.owner_property=SELECT id, owner_id, title, status FROM properties WHERE id = :id

# Public reference data and editorial content
locations.search=SELECT city, state, locality, pincode FROM locations WHERE (:query IS NULL OR lower(city) LIKE :query OR lower(locality) LIKE :query OR pincode LIKE :query) LIMIT 30
locations.insert=INSERT INTO locations (state, city, locality, pincode) VALUES (:state, :city, :locality, :pincode) RETURNING id
projects.list=SELECT id, name, slug, city, locality, price_min, price_max, status, possession_date, rera_number, rera_verified FROM projects WHERE (:city IS NULL OR lower(city) = lower(:city))
projects.by_slug=SELECT id FROM projects WHERE slug = :slug
projects.insert=INSERT INTO projects (id, developer_id, name, slug, city, locality, price_min, price_max, status, possession_date, rera_number, rera_verified) VALUES (:id, :developer_id, :name, :slug, :city, :locality, :price_min, :price_max, :status, :possession_date, :rera_number, :rera_verified)
developers.list=SELECT id, name, description, website, verified FROM developers
developers.insert=INSERT INTO developers (id, name, description, website, verified) VALUES (:id, :name, :description, :website, :verified)
agents.list=SELECT a.id, a.user_id, a.company, a.experience_years, a.locations_served, a.bio, a.verified, u.full_name FROM agents a LEFT JOIN users u ON u.id = a.user_id
agents.insert=INSERT INTO agents (id, user_id, company, experience_years, locations_served, bio, verified) VALUES (:id, :user_id, :company, :experience_years, :locations_served, :bio, :verified)
blog.published=SELECT id, title, slug, excerpt, content, created_at FROM blog_posts WHERE published = TRUE ORDER BY created_at DESC
blog.by_slug=SELECT id FROM blog_posts WHERE slug = :slug
blog.insert=INSERT INTO blog_posts (id, title, slug, excerpt, content, published, created_at) VALUES (:id, :title, :slug, :excerpt, :content, :published, :created_at)
categories.active=SELECT id, name, slug FROM property_categories WHERE is_active = TRUE ORDER BY name
categories.by_name_or_slug=SELECT id FROM property_categories WHERE name = :name OR slug = :slug
categories.insert=INSERT INTO property_categories (name, slug, is_active) VALUES (:name, :slug, :is_active) RETURNING id

