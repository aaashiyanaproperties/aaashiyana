services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aashiyana
      POSTGRES_USER: aashiyana
      POSTGRES_PASSWORD: aashiyana
    ports: ["5432:5432"]
    volumes: ["aashiyana_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aashiyana -d aashiyana"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://aashiyana:aashiyana@postgres:5432/aashiyana
      CORS_ORIGINS: http://localhost:3000
      FIREBASE_PROJECT_ID: aashiyana
      DEV_AUTH_BYPASS: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  aashiyana_pgdata:
